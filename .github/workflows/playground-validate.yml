name: Playground validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      # Temporary release migration: generate npm 0.1.19 lock metadata in CI,
      # then pin and revert this bootstrap step to a frozen install.
      - name: Resolve npm 0.1.19 lockfile for migration
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          echo '=== PUBLIC PUBLISHED PACKAGE SRI ==='
          npm view @axenstudio/axen-form@0.1.19 dist.integrity --registry=https://registry.npmjs.org/
          echo '=== IMPORTER ==='
          sed -n '1,30p' pnpm-lock.yaml
          echo '=== PACKAGE ENTRY ==='
          grep -A9 -F "  '@axenstudio/axen-form@0.1.19':" pnpm-lock.yaml
          echo '=== SNAPSHOT ENTRY ==='
          grep -A7 -F "  '@axenstudio/axen-form@0.1.19(" pnpm-lock.yaml
      - name: Frozen public dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript and Vite build
        run: pnpm build
      - name: Published package and dynamic postal semantic smoke
        run: node --experimental-strip-types tools/validation/semantic-smoke.mjs
